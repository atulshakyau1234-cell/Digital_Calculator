<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1> Flashcard Quiz App</h1>

        <div class="card">
            <h2 id="question"></h2>
            <p id="answer" style="display:none"></p>
        </div>

        <button onclick="showAnswer()">Next</button>
    
    
    <div class="buttons">
        <button onclick="prevCard()">Previous</button>
        <button onclick="nextCard">Next</button>
    </div>
    <hr>

    <h3> Add / Edit Flashcard</h3>

    <input type="text" id="newQuestion" placeholder="Enter Question"><br><br>
    <input type="text" id="newAnswer" placeholder="Enter Answer"><br><br>

    <button onclick="addCard()">Add Card</button>
    <button onclick="editCard">Edit Current</button>
    <button onclick="deleteCard"> Delete Current</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
