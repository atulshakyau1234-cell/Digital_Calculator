<!DOCTYPE html>
<html lang="en">
<head>

    <title>Registration Form</title>
    <link rel="stylesheet" href="Registration.css"
</head>
<body bgcolor="pink">
    <center>
    <form>
        <table border="0">
            <h1><u>Student Registration Form</u></caption>

            <div class="border">
            <tr>
                <td>Roll no. : </td>
                <td><input type="number" placeholder="Enter Your Roll no." id="box"></td>
            </tr>
            <tr>
                <td>Student name :&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</td>
                <td><input type="text" placeholder="Enter Your name" id="box"></td>

            </tr>
            <tr>
                <td>Father's name :</td>
                <td><input type="text" placeholder="Enter your Father's name" id="box"></td>

            </tr>
            <tr>
                <td>Date of birth :</td>
                <td><input type="date" id="box"></td>
            </tr>
            <tr>
                <td>Mobile no. :</td>
                <td><input type="number" placeholder="Enter Mobile no." id="box"></td>
            </tr>
            <tr>
                <td>Email id :</td>
                <td><input type="email" placeholder="Enter Your Email id." id="box"></td>
            </tr>
            <tr>
                <td>Password :</td>
                <td><input type="password" placeholder="Enter Your Password" id="box"></td>
            </tr>
            <tr>
                <td>Gender :</td>
                <td><input type="radio" class="rad">Male</td>
               <td><input type="radio" class="rad">Female</td >
            </tr>
            <tr>
                <td>Department :</td>
                <td><input type="checkbox" class="chec">CSE</td>
                <td><input type="checkbox" class="chec">IT</td>
                <td><input type="checkbox" class="chec">ECE</td>
                <td><input type="checkbox" class="chec">Civil</td>
                <td><input type="checkbox" class="chec">Mech</td>
            </tr>
            <tr>
                <td>Course :</td>
                <td><input type="text" placeholder="Enter Your Course Name" id="box"></td>
            </tr>
            <tr>
                <td>Student photo :</td>
                <td ><button type="submit" class="btn1">Choose file</button>  No file Chosen</td>
            </tr>
            <tr>
                <td>City :</td>
                <td><input type="text" placeholder="Enter Your City" id="box"></td>
            </tr>
            <tr>
            <td>Address :</td>
            <td><input type="text" placeholder="Enter your Address" id="box"></td>
            </tr>
            </div>
            <td ><button type="submit" class="btn2">Register</button></td>
        </table>
     
    </form>

</body>
</html>
